<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jean Franco Carnevali | WDD 131 | Week 05">
    <meta name="author" content="Jean Franco Carnevali">
    <title>Form | WDD 131 | Week 05 Assignment | Jean Franco Carnevali</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="product">Product Name *</label>
            <select id="product" name="product" required>
                <option value="">Select A Product...</option>
            </select>

            <p>Overall Rating *</p>
            <div class="rating">
                <input type="radio" id="fivestar" name="rating" value="5" required><label for="fivestar"></label>
                <input type="radio" id="fourstar" name="rating" value="4" required><label for="fourstar"></label>
                <input type="radio" id="threestar" name="rating" value="3" required><label for="threestar"></label>
                <input type="radio" id="twostar" name="rating" value="2" required><label for="twostar"></label>
                <input type="radio" id="onestar" name="rating" value="1" required><label for="onestar"></label>
            </div>

            <p>Which features did you find useful in the product? (Check All That Apply)</p>
            <label for="durability">
                <input type="checkbox" id="durability" name="features" value="durability">Durability
            </label>
            <label for="easeOfUse">
                <input type="checkbox" id="easeOfUse" name="features" value="easeOfUse">Ease Of Use
            </label>
            <label for="performance">
                <input type="checkbox" id="performance" name="features" value="performance">Performance
            </label>
            <label for="design">
                <input type="checkbox" id="design" name="features" value="design">Design
            </label>

            <label for="review">Written Review
                <span class="optional">(Optional)</span>
            </label>
            <textarea name="review" id="review" rows="6"></textarea>

            <label for="name">Your Name
                <span class="optional">(Optional)</span>
            </label>
            <input type="text" name="name" id="name">

            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>© <span id="currentyear"></span> Jean Franco Carnevali - Bogotá, Colombia</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
