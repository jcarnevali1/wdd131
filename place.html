<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WDD 131 – Country Page - Jean Franco Carnevali</title>
  <meta name="description" content="Week 3 Assignment: Country Page | Jean Franco Carnevali">
  <meta name="author" content="Jean Franco Carnevali Rodriguez">
  <link rel="stylesheet" href="styles/place.css">
  <script src="scripts/place.js" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Venezuela</h1>
    </header>
    <main>
        <picture class="hero">
            <source srcset="images/venezuela-large.webp" media="(min-width: 700px)">
            <img src="images/venezuela.webp" alt="Waterfall in Venezuela Jungle" width="640" height="960" fetchpriority="high">
        </picture>
        <section class="data">
            <h2>Data</h2>

            <div class="info">

                <span class="label">Area:</span>
                <span class="label-info">916,445 sq km</span>

                <span class="label">Population</span>
                <span class="label-info">28,651,564</span>

                <span class="label">Capital:</span>
                <span class="label-info">Caracas</span>

                <span class="label">Languages:</span>
                <span class="label-info">Spanish</span>

                <span class="label">Currency:</span>
                <span class="label-info">Bolivar</span>

                <span class="label">Time Zone:</span>
                <span class="label-info">UTC-4</span>

                <span class="label">Calling Code:</span>
                <span class="label-info">+58</span>

                <span class="label">Internet TLD:</span>
                <span class="label-info">.ve</span>

            </div>
        </section>

        <section class="weather">
            <h2>Weather</h2>
           <img class="weather-icon" src="images/weather.svg" width="80" height="80" alt="Weather Icon"> 

           <div class="info">
                <span class="label">Temperature:</span>
                <span class="label-info">26°C</span>

                <span class="label">Conditions:</span>
                <span class="label-info">Light rain</span>

                <span class="label">Wind:</span>
                <span class="label-info">6 km/h</span>

                <span class="label">Wind Chill:</span>
                <span class="label-info" id="windchill"></span>
           </div>

        </section>
    </main>
    <footer>
        <p>© <span id="currentyear"></span> Jean Franco Carnevali - Bogotá, Colombia</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
