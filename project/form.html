<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Parilli Vehicles Newsletter Form | WDD 131 | Week 06">
    <meta name="author" content="Jean Franco Carnevali">
    <title>Newsletter Form | Parilli</title>
    <link rel="stylesheet" href="styles/project.css">
    <script src="scripts/project.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="project.html">
            <img src="images/parilli-logo-white.svg" alt="Parilli Brand Logo" width="150">
        </a>
        <button id="menu" aria-label="Open Menu"></button>
        <nav id="navigation">
            <a href="vehicles.html">Vehicles</a>
            <a href="about.html">About Us</a>
        </nav>
    </header>
    <main class="form-main">
        <section class="form-section">
            <h1 class="form-title">Newsletter Sign Up</h1>
            <p class="description">Join our newsletter to receive early updates on new releases, special incentives, and upcoming experiences.</p>
                <form method="get" action="confirmation.html">
                    <label for="first-name">First Name</label>
                    <input type="text" name="first-name" id="first-name" required>

                    <label for="last-name">Last Name</label>
                    <input type="text" name="last-name" id="last-name" required>

                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" required>

                    <label for="product">Country</label>
                    <select id="product" name="product" required>
                        <option value="" disabled selected>Select A Country...</option>
                    </select>

                    <p>Which vehicles are you interested in?</p>
                    <label for="one">
                        <input type="checkbox" id="one" name="vehicles" value="one">Model One
                    </label>
                    <label for="performance">
                        <input type="checkbox" id="performance" name="vehicles" value="performance">Model One Performance
                    </label>
                    <label for="suv">
                        <input type="checkbox" id="suv" name="vehicles" value="suv">Model SUV
                    </label>
                    <label for="sedan">
                        <input type="checkbox" id="sedan" name="vehicles" value="sedan">Model Sedan
                    </label>
                    <br>

                    <label for="feedback">Feedback
                        <span class="optional">(Optional)</span>
                    </label>
                    <textarea name="feedback" id="feedback" rows="6"></textarea>

                    <input type="submit" value="Submit">
                </form>
        </section>
    </main>
    <footer>
        <p>Parilli © <span id="currentyear"></span></p>
        <div class="links">
            <a href="vehicles.html">Vehicles</a>
            <a href="about.html">About Us</a>
            <a href="form.html">Newsletter</a>
            <a href="references.html">References</a>
        </div>
    </footer>
</body>
</html>
